name: "Build and push container image"

# Tagging strategy (rubric: "consistent and immutable"):
#   - every successful build on main pushes exactly ONE tag:
#       sha-<12-char-git-sha>   a brand-new, never-reused tag every time
#   - the ECR repo itself is ImageTagMutability: IMMUTABLE (see
#     ecs-bluegreen-lab-infra/cfn/modules/03-ecr-endpoints.yaml), which
#     means re-pushing any existing tag string would be rejected outright
#     -- so there is no floating ":latest" pointer at all here.
#   - the deploy pipeline doesn't need one: EventBridge (EcrPushRule in
#     05-cicd-pipeline.yaml) fires on ANY successful "sha-*" push and
#     passes the exact image DIGEST that was just pushed into CodePipeline
#     as a source-revision override, so the pipeline always deploys the
#     specific image this workflow just built -- see that file's comments,
#     and https://docs.aws.amazon.com/codepipeline/latest/userguide/pipelines-trigger-source-overrides.html
on:
  push:
    branches: [main]

permissions:
  id-token: write   # required for OIDC -> AWS
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image tag
        id: tags
        run: |
          SHORT_SHA=$(git rev-parse --short=12 HEAD)
          REPO_URI="${{ steps.ecr-login.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$REPO_URI:sha-$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          build-args: |
            APP_VERSION=${{ steps.tags.outputs.short_sha }}
          tags: |
            ${{ steps.tags.outputs.sha_tag }}

      - name: Push image (this push is what triggers the deploy pipeline)
        run: docker push ${{ steps.tags.outputs.sha_tag }}

      - name: Summary
        run: |
          echo "### Image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.tags.outputs.sha_tag }}\` (immutable, deploy trigger)" >> "$GITHUB_STEP_SUMMARY"
