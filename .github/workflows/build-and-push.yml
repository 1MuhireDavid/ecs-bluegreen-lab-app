name: "Build and push container image"

# Tagging strategy (rubric: "consistent and mutable"):
#   - every successful build on main is pushed under BOTH tags:
#       sha-<12-char-git-sha>   immutable, for traceability/rollback
#       latest                  mutable, the ONE tag EventBridge + the
#                               CodePipeline ECR source action watch as
#                               "the newest version to deploy"
#   - the ECR repo itself is ImageTagMutability: MUTABLE (see
#     ecs-bluegreen-lab-infra/cfn/modules/03-ecr-endpoints.yaml), which is
#     what makes re-pushing ":latest" on every build valid rather than
#     rejected.
on:
  push:
    branches: [main]

permissions:
  id-token: write   # required for OIDC -> AWS
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image tags
        id: tags
        run: |
          SHORT_SHA=$(git rev-parse --short=12 HEAD)
          REPO_URI="${{ steps.ecr-login.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$REPO_URI:sha-$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$REPO_URI:latest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          build-args: |
            APP_VERSION=${{ steps.tags.outputs.short_sha }}
          tags: |
            ${{ steps.tags.outputs.sha_tag }}
            ${{ steps.tags.outputs.latest_tag }}

      - name: Push immutable sha tag (traceability / rollback target)
        run: docker push ${{ steps.tags.outputs.sha_tag }}

      - name: Push mutable latest tag (triggers the deploy pipeline)
        run: docker push ${{ steps.tags.outputs.latest_tag }}

      - name: Summary
        run: |
          echo "### Image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.tags.outputs.sha_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.tags.outputs.latest_tag }}\` (deploy trigger)" >> "$GITHUB_STEP_SUMMARY"
